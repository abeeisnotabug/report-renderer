# run.conf: the stages of one companion run, read by run-companion.sh and by the waste check.
# Fill every <...>. Models and PARALLEL_PAGES are the defaults (big-tasks T3, T4); change them only with a reason.
PAGES=(<page tag> <page tag>)     # one short tag per page, in the order their contracts are written
WRITERS=(<n> <n>)                 # writers per page, in the order of PAGES
TRANSCRIBE=(<chunk tag> <chunk tag>)  # one per brief-transcribe-<tag>.md; () when sources/ already has every transcript
MODEL_TRANSCRIBE=claude-sonnet-5-5
MODEL_CONTRACT=claude-opus-5-5
MODEL_WRITER=claude-opus-5-5
MODEL_READER=claude-sonnet-5-5
MODEL_FIXER=claude-sonnet-5-5
PARALLEL_PAGES=1                  # 1: the pages' writer chains run side by side; 0: one after another
